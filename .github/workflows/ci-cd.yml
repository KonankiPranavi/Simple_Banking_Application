name: Banking App CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Automated Tests
        run: |
          pytest app/test_app.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: Konankipranavi
          password: Nellore@0325

      - name: Build and Push Docker Image
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          docker build -t Konankipranavi/banking-app:$TAG .
          docker push Konankipranavi/banking-app:$TAG

      - name: Setup Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|Konankipranavi/banking-app:IMAGE_TAG|Konankipranavi/banking-app:$TAG|g" k8s-deployment.yml
          kubectl apply -f k8s-deployment.yml
