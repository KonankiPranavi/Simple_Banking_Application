name: Kubernetes CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Source Code Checkout
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 2. Install Dependencies (CI)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 3. Run Automated Tests (CI)
      run: |
        pytest app/test_app.py

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 4. Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          konankipranavi/simple-banking-app:${{ github.sha }}
          konankipranavi/simple-banking-app:latest

    - name: 5. Deployment Setup (Kubernetes Simulation)
      run: |
        echo "Configuring cluster deployment context..."
        echo "Deploying application tag: ${{ github.sha }}"
